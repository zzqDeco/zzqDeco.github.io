<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Graphiti search, reranking, and context construction</title>
  <desc id="desc">A query fans out to semantic, lexical, and graph traversal retrieval before configurable reranking and context construction.</desc>
  <style>
    text { font-family: Inter, ui-sans-serif, system-ui, sans-serif; fill: #17202a; }
    .title { font-size: 30px; font-weight: 700; }
    .subtitle { font-size: 16px; fill: #4f5b66; }
    .head { font-size: 18px; font-weight: 700; }
    .label { font-size: 15px; font-weight: 600; }
    .small { font-size: 13px; fill: #4f5b66; }
    .edge { stroke: #67747e; stroke-width: 2.5; fill: none; }
  </style>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#67747e"/></marker></defs>
  <rect width="1200" height="680" fill="#ffffff"/>
  <text x="55" y="58" class="title">Search is a configurable pipeline, not one score</text>
  <text x="55" y="87" class="subtitle">Candidate retrieval phi, reranking rho, and context construction chi</text>

  <rect x="55" y="265" width="155" height="85" rx="8" fill="#eef4f7" stroke="#577b91" stroke-width="2"/>
  <text x="132" y="300" text-anchor="middle" class="head">Query</text>
  <text x="132" y="326" text-anchor="middle" class="small">text + filters + center</text>
  <path d="M210 307 H265" class="edge" marker-end="url(#arrow)"/>

  <rect x="270" y="125" width="235" height="115" rx="8" fill="#f3eef8" stroke="#8b66a8" stroke-width="2"/>
  <text x="387" y="160" text-anchor="middle" class="head">Semantic retrieval</text>
  <text x="387" y="188" text-anchor="middle" class="label">Cosine similarity</text>
  <text x="387" y="214" text-anchor="middle" class="small">paraphrases and latent meaning</text>
  <rect x="270" y="260" width="235" height="115" rx="8" fill="#f7f1e6" stroke="#ad7b2c" stroke-width="2"/>
  <text x="387" y="295" text-anchor="middle" class="head">Lexical retrieval</text>
  <text x="387" y="323" text-anchor="middle" class="label">BM25 / full text</text>
  <text x="387" y="349" text-anchor="middle" class="small">names, identifiers, exact wording</text>
  <rect x="270" y="395" width="235" height="115" rx="8" fill="#eaf5ed" stroke="#548a65" stroke-width="2"/>
  <text x="387" y="430" text-anchor="middle" class="head">Graph retrieval</text>
  <text x="387" y="458" text-anchor="middle" class="label">BFS neighborhood</text>
  <text x="387" y="484" text-anchor="middle" class="small">structural proximity and paths</text>
  <path d="M242 307 C242 190 252 182 270 182" class="edge" marker-end="url(#arrow)"/>
  <path d="M242 307 H270" class="edge" marker-end="url(#arrow)"/>
  <path d="M242 307 C242 445 252 452 270 452" class="edge" marker-end="url(#arrow)"/>

  <rect x="570" y="160" width="260" height="300" rx="8" fill="#f7f9fa" stroke="#84919a" stroke-width="2"/>
  <text x="700" y="198" text-anchor="middle" class="head">Configurable reranking rho</text>
  <text x="605" y="240" class="label">RRF</text><text x="665" y="240" class="small">rank fusion</text>
  <text x="605" y="278" class="label">MMR</text><text x="665" y="278" class="small">relevance + diversity</text>
  <text x="605" y="316" class="label">Mentions</text><text x="690" y="316" class="small">episode frequency</text>
  <text x="605" y="354" class="label">Distance</text><text x="688" y="354" class="small">from center node</text>
  <text x="605" y="392" class="label">Cross encoder</text><text x="725" y="392" class="small">costlier pair scoring</text>
  <text x="700" y="433" text-anchor="middle" class="small">recipes select only the needed stages</text>
  <path d="M505 182 C545 182 545 215 570 215" class="edge" marker-end="url(#arrow)"/>
  <path d="M505 317 H570" class="edge" marker-end="url(#arrow)"/>
  <path d="M505 452 C545 452 545 405 570 405" class="edge" marker-end="url(#arrow)"/>

  <rect x="900" y="230" width="245" height="155" rx="8" fill="#edf5fa" stroke="#4e7f9f" stroke-width="2"/>
  <text x="1022" y="266" text-anchor="middle" class="head">Constructor chi</text>
  <text x="1022" y="298" text-anchor="middle" class="small">dated facts</text>
  <text x="1022" y="322" text-anchor="middle" class="small">entity summaries</text>
  <text x="1022" y="346" text-anchor="middle" class="small">community summaries</text>
  <text x="1022" y="370" text-anchor="middle" class="small">bounded agent context</text>
  <path d="M830 307 H900" class="edge" marker-end="url(#arrow)"/>

  <rect x="180" y="560" width="840" height="62" rx="8" fill="#fff8e8" stroke="#c59a38"/>
  <text x="600" y="586" text-anchor="middle" class="label">Simple search can use RRF without an LLM rerank</text>
  <text x="600" y="609" text-anchor="middle" class="small">A cross encoder is optional and changes latency, cost, and relevance behavior</text>
</svg>
