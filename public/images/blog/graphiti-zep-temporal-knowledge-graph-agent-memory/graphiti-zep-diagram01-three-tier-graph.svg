<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Three-tier temporal memory graph</title>
  <desc id="desc">A reconstructed diagram of episodic, semantic entity, and community subgraphs with provenance links.</desc>
  <style>
    text { font-family: Inter, ui-sans-serif, system-ui, sans-serif; fill: #17202a; }
    .title { font-size: 30px; font-weight: 700; }
    .subtitle { font-size: 16px; fill: #4f5b66; }
    .band-title { font-size: 21px; font-weight: 700; }
    .label { font-size: 15px; font-weight: 600; }
    .small { font-size: 13px; fill: #4f5b66; }
    .edge { stroke: #697681; stroke-width: 2; fill: none; }
    .dashed { stroke-dasharray: 7 6; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#697681"/>
    </marker>
  </defs>
  <rect width="1200" height="700" fill="#ffffff"/>
  <text x="60" y="58" class="title">Temporal agent memory: three connected subgraphs</text>
  <text x="60" y="88" class="subtitle">Reconstructed from the Zep paper model; not an original paper figure</text>

  <rect x="50" y="120" width="1100" height="155" rx="8" fill="#f4f8fb" stroke="#8da9bd" stroke-width="2"/>
  <text x="75" y="154" class="band-title">Community subgraph Gc</text>
  <text x="75" y="180" class="small">Coarse themes, labels, and summaries over groups of entity nodes</text>
  <rect x="275" y="194" width="210" height="55" rx="7" fill="#d7e9f4" stroke="#477a9e"/>
  <text x="380" y="227" text-anchor="middle" class="label">Product migration</text>
  <rect x="505" y="194" width="190" height="55" rx="7" fill="#d7e9f4" stroke="#477a9e"/>
  <text x="600" y="227" text-anchor="middle" class="label">Team context</text>
  <rect x="715" y="194" width="210" height="55" rx="7" fill="#d7e9f4" stroke="#477a9e"/>
  <text x="820" y="227" text-anchor="middle" class="label">Customer history</text>

  <rect x="50" y="300" width="1100" height="190" rx="8" fill="#fbf8f1" stroke="#c7a663" stroke-width="2"/>
  <text x="75" y="336" class="band-title">Semantic entity subgraph Gs</text>
  <text x="75" y="362" class="small">Entity nodes plus time-bounded fact edges, each retaining source episode provenance</text>
  <circle cx="260" cy="417" r="38" fill="#f5dfad" stroke="#9d7627" stroke-width="2"/>
  <text x="260" y="422" text-anchor="middle" class="label">Alice</text>
  <circle cx="510" cy="417" r="38" fill="#f5dfad" stroke="#9d7627" stroke-width="2"/>
  <text x="510" y="422" text-anchor="middle" class="label">Acme</text>
  <circle cx="760" cy="417" r="38" fill="#f5dfad" stroke="#9d7627" stroke-width="2"/>
  <text x="760" y="422" text-anchor="middle" class="label">Project X</text>
  <circle cx="990" cy="417" r="38" fill="#f5dfad" stroke="#9d7627" stroke-width="2"/>
  <text x="990" y="413" text-anchor="middle" class="label">Berlin</text>
  <text x="990" y="432" text-anchor="middle" class="small">office</text>
  <path d="M300 417 H468" class="edge" marker-end="url(#arrow)"/>
  <text x="384" y="401" text-anchor="middle" class="small">works at</text>
  <path d="M550 417 H718" class="edge" marker-end="url(#arrow)"/>
  <text x="634" y="401" text-anchor="middle" class="small">owns</text>
  <path d="M800 417 H948" class="edge" marker-end="url(#arrow)"/>
  <text x="874" y="401" text-anchor="middle" class="small">moved to</text>
  <path d="M380 249 C380 290 320 319 278 377" class="edge dashed" marker-end="url(#arrow)"/>
  <path d="M600 249 C600 302 550 332 520 379" class="edge dashed" marker-end="url(#arrow)"/>
  <path d="M820 249 C820 300 806 337 777 381" class="edge dashed" marker-end="url(#arrow)"/>

  <rect x="50" y="515" width="1100" height="135" rx="8" fill="#f4faf6" stroke="#6da580" stroke-width="2"/>
  <text x="75" y="550" class="band-title">Episode subgraph Ge</text>
  <text x="75" y="576" class="small">Raw messages, text, or JSON: the non-lossy evidence layer and audit trail</text>
  <rect x="245" y="594" width="210" height="38" rx="6" fill="#d9efdf" stroke="#4d8a61"/>
  <text x="350" y="619" text-anchor="middle" class="label">Episode 2025-01-03</text>
  <rect x="495" y="594" width="210" height="38" rx="6" fill="#d9efdf" stroke="#4d8a61"/>
  <text x="600" y="619" text-anchor="middle" class="label">Episode 2025-02-14</text>
  <rect x="745" y="594" width="210" height="38" rx="6" fill="#d9efdf" stroke="#4d8a61"/>
  <text x="850" y="619" text-anchor="middle" class="label">Episode 2025-03-08</text>
  <path d="M350 594 C350 535 308 502 272 456" class="edge dashed" marker-end="url(#arrow)"/>
  <path d="M600 594 C600 535 566 490 522 456" class="edge dashed" marker-end="url(#arrow)"/>
  <path d="M850 594 C850 535 813 491 775 456" class="edge dashed" marker-end="url(#arrow)"/>
  <text x="1028" y="621" class="small">provenance</text>
</svg>
