<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Graphiti v0.29.2 code architecture</title>
  <desc id="desc">The public API, orchestration modules, provider adapters, graph drivers, and optional server layers of Graphiti v0.29.2.</desc>
  <style>
    text { font-family: Inter, ui-sans-serif, system-ui, sans-serif; fill: #17202a; }
    .title { font-size: 30px; font-weight: 700; }
